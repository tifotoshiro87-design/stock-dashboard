<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bảng theo dõi cổ phiếu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#e6edf3;font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
.mu{color:#8b949e}.up{color:#3fb950}.dn{color:#f85149}.rf{color:#d29922}
#top{position:sticky;top:0;z-index:10;background:#0d1117;padding:env(safe-area-inset-top,0) 12px 0;border-bottom:1px solid #30363d}
h1{font-size:16px;margin:8px 0 2px}
#ban{font-size:12px;background:#2a2110;border:1px solid #5a4514;color:#e3b341;border-radius:6px;padding:6px 8px;margin:6px 0}
#tabs{display:flex;gap:4px}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#8b949e;padding:8px 10px;font-size:14px}
#tabs button.on{color:#e6edf3;border-color:#d29922}
#grp{display:flex;gap:12px;overflow-x:auto;padding:6px 0;white-space:nowrap}
#grp span{color:#8b949e;font-size:13px;cursor:pointer}#grp span.on{color:#d29922;font-weight:600}
#cards{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.sc{flex:0 0 118px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:6px 8px;cursor:pointer}
.sc.on{border-color:#8b949e;background:#1c2330}
.sc small{display:block;color:#8b949e;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{display:block;font-size:15px}
main{padding:12px;max-width:1300px;margin:auto}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}
.g2{display:grid;gap:12px}@media(min-width:900px){.g2{grid-template-columns:2fr 1fr}}
.ch{width:100%;height:280px}.ch.s{height:130px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #21262d}
.i{cursor:pointer;color:#8b949e;border:1px solid #30363d;border-radius:50%;padding:0 5px;font-size:11px;margin-left:4px}
.tip{display:none;font-size:12px;color:#8b949e;font-style:italic;padding:2px 0 6px}.tip.on{display:block}
.bd{display:inline-block;border-radius:10px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
.bg{background:#12351f;color:#3fb950}.br{background:#3d1519;color:#f85149}.by{background:#3a2d0c;color:#d29922}
.sig{display:inline-block;padding:6px 14px;border-radius:6px;font-weight:700;border:1px solid #30363d}
.sig.MUA{color:#3fb950;border-color:#3fb950}.sig.BAN{color:#f85149;border-color:#f85149}
.cr{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #21262d}
.cr em{display:block;color:#8b949e;font-size:12px}
.bx{display:inline-block;min-width:110px;min-height:30px;border:1px solid #30363d;border-radius:5px;padding:2px 6px;margin:4px 6px 0 0;font-size:12px;vertical-align:top}
.bx i{display:block;font-size:10px;color:#8b949e;font-style:normal}
select,input{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:5px;padding:6px}
input{width:64px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #21262d;padding:6px;text-align:left;vertical-align:top}
.nw{padding:10px 0;border-bottom:1px solid #21262d}.nw a{color:#e3b341;font-size:12px}
.tag{font-size:11px;background:#1f2a44;color:#79c0ff;border-radius:10px;padding:1px 8px}
.hide{display:none}
</style></head><body>
<div id="top">
 <h1>Bảng theo dõi cổ phiếu — 17 mã, 5 nhóm ngành</h1>
 <div id="ban">Đang tải dữ liệu…</div>
 <div id="tabs"><button data-t="1" class="on">Chỉ số cổ phiếu</button><button data-t="2">Chấm điểm vĩ mô</button><button data-t="3">Tin tức</button></div>
 <div id="bar"><div id="grp"></div><div id="cards"></div></div>
</div>
<main>
 <section id="t1"><div id="detail"></div></section>
 <section id="t2" class="hide"></section>
 <section id="t3" class="hide"></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";
// ===== Danh mục cố định (mã, tên, nhóm, sàn) — dùng khi chưa có prices.json =====
const G=["Ngân hàng","Bán lẻ – Tiêu dùng","Cao su – KCN","Công nghệ thông tin","Xây dựng – Đầu tư công"];
const ST=[["VCB","NH TMCP Ngoại thương Việt Nam",0,"HOSE"],["VPB","NH TMCP Việt Nam Thịnh Vượng",0,"HOSE"],["HDB","NH TMCP Phát triển TP.HCM",0,"HOSE"],
["MWG","CTCP Đầu tư Thế Giới Di Động",1,"HOSE"],["MSN","CTCP Tập đoàn Masan",1,"HOSE"],["DGW","CTCP Thế Giới Số",1,"HOSE"],["PNJ","CTCP Vàng bạc Đá quý Phú Nhuận",1,"HOSE"],
["GVR","Tập đoàn Công nghiệp Cao su Việt Nam",2,"HOSE"],["PHR","CTCP Cao su Phước Hòa",2,"HOSE"],["IDC","Tổng Công ty IDICO – CTCP",2,"HNX"],
["FPT","CTCP FPT",3,"HOSE"],["CMG","CTCP Tập đoàn Công nghệ CMC",3,"HOSE"],
["VCG","Tổng CTCP XNK và Xây dựng Việt Nam (Vinaconex)",4,"HOSE"],["HHV","CTCP Đầu tư Hạ tầng Giao thông Đèo Cả",4,"HOSE"],["LCG","CTCP Lizen",4,"HOSE"],["FCN","CTCP FECON",4,"HOSE"],["CTD","CTCP Xây dựng Coteccons",4,"HOSE"]].map(a=>({s:a[0],n:a[1],g:a[2],x:a[3]}));
// 14 tiêu chí: [ký hiệu, tên, giải thích, nhóm, có số liệu?, ngành hưởng lợi khi +1, ngành bất lợi khi -1]
const CR=[
["A","Lãi suất điều hành NHNN","Lãi suất thấp giúp doanh nghiệp vay rẻ; tăng lãi suất kiềm chế lạm phát nhưng làm chi phí vốn cao hơn.",0,1,"Xây dựng, Bán lẻ, Ngân hàng","Xây dựng, Bán lẻ (chi phí vốn cao)"],
["B","Tỷ giá USD/VND","VND mất giá có lợi cho xuất khẩu nhưng bất lợi cho doanh nghiệp vay nợ hoặc nhập khẩu bằng USD.",0,1,"Bán lẻ, Xây dựng (ổn định tỷ giá)","Bán lẻ, Xây dựng (nợ/nhập khẩu USD); có lợi cho Cao su xuất khẩu"],
["C","CPI / lạm phát","Giá tiêu dùng tăng nhanh làm giảm sức mua và có thể buộc NHNN thắt chặt tiền tệ.",0,1,"Bán lẻ, Ngân hàng","Bán lẻ (sức mua), Xây dựng (giá vật liệu)"],
["D","Tiến độ giải ngân đầu tư công","Giải ngân nhanh tạo doanh thu trực tiếp cho nhóm xây dựng, vật liệu, hạ tầng.",0,1,"Xây dựng – Đầu tư công, KCN","Xây dựng – Đầu tư công"],
["E","Thanh khoản / room tín dụng","Vốn dễ vay giúp doanh nghiệp và nhà đầu tư dễ tiếp cận vốn hơn.",0,1,"Ngân hàng, Xây dựng, Bán lẻ","Ngân hàng, Xây dựng"],
["F","Chính sách / luật mới ảnh hưởng ngành","Thay đổi pháp lý (thuế, đất đai, đầu tư…) tác động trực tiếp đến kinh doanh của ngành.",1,0,"Ngành được chính sách hỗ trợ","Ngành bị siết quy định"],
["G","Ổn định chính trị – xã hội","Môi trường ổn định giúp duy trì niềm tin nhà đầu tư trong và ngoài nước.",1,0,"Toàn thị trường","Toàn thị trường"],
["H","Lãi suất Fed","Fed tăng lãi suất thường hút dòng vốn về Mỹ, gây áp lực lên tỷ giá và thị trường mới nổi.",2,1,"Toàn thị trường, Ngân hàng","CNTT (định giá), toàn thị trường"],
["I","Chỉ số DXY","USD mạnh lên thường gây áp lực lên VND, vàng và dòng vốn vào thị trường mới nổi.",2,1,"Toàn thị trường, Bán lẻ","Bán lẻ, Xây dựng (nhập khẩu, tỷ giá)"],
["J","Giá dầu thế giới","Giá dầu tăng làm chi phí vận chuyển, sản xuất tăng.",2,1,"Xây dựng, Bán lẻ (chi phí thấp)","Xây dựng, KCN, logistics, vật liệu"],
["K","Chứng khoán Mỹ (S&P500/Nasdaq)","Xu hướng thị trường Mỹ tác động tâm lý và dòng vốn toàn cầu.",2,1,"Toàn thị trường, CNTT","Toàn thị trường, CNTT"],
["L","Căng thẳng thương mại / địa chính trị","Xung đột, cạnh tranh thương mại làm rủi ro chuỗi cung ứng và biến động giá hàng hóa.",2,0,"Cao su, KCN, CNTT xuất khẩu","Cao su, KCN, CNTT xuất khẩu"],
["M","Dòng vốn khối ngoại tại VN","Khối ngoại mua ròng thể hiện niềm tin vào thị trường và hỗ trợ giá cổ phiếu.",3,1,"Toàn thị trường, nhóm vốn hóa lớn","Toàn thị trường, nhóm vốn hóa lớn"],
["N","Tin tức riêng của 5 nhóm ngành","Tin về hoạt động kinh doanh, đơn hàng, dự án của các nhóm ngành trong danh mục.",3,0,"Nhóm có tin tốt (xem tab Tin tức)","Nhóm có tin xấu (xem tab Tin tức)"]];
const GH=["Vĩ mô trong nước","Chính trị – chính sách","Quốc tế – địa chính trị","Dòng tiền & tin ngành"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>(v==null||typeof v!=="number"||!isFinite(v))?"—":v.toLocaleString("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d});
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=null,M=null,N=null,ERR=[],sel=null,grp=0,stamp="",charts=[];

// ===== Nạp dữ liệu online, tự làm mới mỗi 60 giây và khi mở lại app =====
async function getJ(f){const r=await fetch("data/"+f+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(f+" "+r.status);return r.json()}
async function load(){
 const r=await Promise.allSettled([getJ("prices.json"),getJ("macro.json"),getJ("news.json")]);
 if(r[0].status=="fulfilled")P=r[0].value;if(r[1].status=="fulfilled")M=r[1].value;if(r[2].status=="fulfilled")N=r[2].value;
 ERR=["prices","macro","news"].filter((_,i)=>r[i].status=="rejected");
 const st=JSON.stringify([P&&P.meta,M&&M.meta,N&&N.meta,ERR]);
 banner();if(st!==stamp){stamp=st;renderAll()}
}
function banner(){
 const b=$("#ban");let t="";
 if(P&&P.meta){const m=P.meta,miss=ST.filter(s=>{const d=P.stocks.find(x=>x.symbol==s.s);return !d||!d.candles||!d.candles.length}).map(s=>s.s);
  t=`✓ Dữ liệu giá (Yahoo Finance/vnstock) — phiên gần nhất <b>${esc(m.latest_session||"chưa rõ")}</b>, lấy lúc ${esc(m.fetched_at||"?")}. ${m.sample?"<b>DỮ LIỆU MẪU.</b> ":""}Mã chưa có dữ liệu thật: <b>${miss.length?miss.join(", "):"không"}</b>. `}
 else t=`Chưa tải được dữ liệu giá (mất mạng hoặc chưa có file data/prices.json — hãy mở app qua địa chỉ web, không mở trực tiếp file). `;
 if(ERR.length&&P)t+=`Chưa tải được: ${ERR.join(", ")}. `;
 $("#ban").innerHTML=t+"Chỉ báo/tín hiệu và điểm số chỉ mang tính tham khảo — không phải khuyến nghị đầu tư."}
function renderAll(){cards();detail();t2();t3()}

// ===== Chỉ báo kỹ thuật (công thức chuẩn) =====
function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}
function ema(a,n){const o=Array(a.length).fill(null);if(a.length<n)return o;let p=a.slice(0,n).reduce((x,y)=>x+y,0)/n;o[n-1]=p;const k=2/(n+1);for(let i=n;i<a.length;i++){p=a[i]*k+p*(1-k);o[i]=p}return o}
function rsi(a,n=14){const o=Array(a.length).fill(null);if(a.length<=n)return o;let g=0,l=0;for(let i=1;i<=n;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}g/=n;l/=n;o[n]=l==0?100:100-100/(1+g/l);
 for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=l==0?100:100-100/(1+g/l)}return o}
function bb(a,n=20,k=2){const m=sma(a,n);return a.map((_,i)=>{if(m[i]==null)return null;const s=a.slice(i-n+1,i+1),sd=Math.sqrt(s.reduce((x,y)=>x+(y-m[i])**2,0)/n);return{u:m[i]+k*sd,l:m[i]-k*sd}})}
function macd(a){const e1=ema(a,12),e2=ema(a,26),ln=a.map((_,i)=>e2[i]==null?null:e1[i]-e2[i]),i0=ln.findIndex(v=>v!=null),sg=Array(a.length).fill(null);
 if(i0>=0)ema(ln.slice(i0),9).forEach((v,i)=>sg[i0+i]=v);return{ln,sg,h:ln.map((v,i)=>sg[i]==null?null:v-sg[i])}}

// ===== Tab 1 =====
function cards(){
 $("#grp").innerHTML=G.map((g,i)=>`<span class="${i==grp?"on":""}" data-g="${i}">${g}</span>`).join("");
 $("#cards").innerHTML=ST.filter(s=>s.g==grp).map(s=>{const d=P&&P.stocks.find(x=>x.symbol==s.s),C=d&&d.candles||[];let p="Chưa có dữ liệu",c="mu";
  if(C.length>1){const a=C[C.length-1].c,b=C[C.length-2].c,ch=(a/b-1)*100;c=ch>0?"up":ch<0?"dn":"rf";p=`${fmt(a)} (${ch>0?"+":""}${fmt(ch,1)}%)`}
  return `<div class="sc ${s.s==sel?"on":""}" data-s="${s.s}"><small>${esc(s.n)}</small><b>${s.s}</b><span class="${c}" style="font-size:12px">${p}</span></div>`}).join("")}
const TIPS={
 close:"Giá đóng cửa: giá chốt phiên gần nhất.",
 ema20:"EMA20: đường giá trung bình 20 phiên, nhạy với giá mới. Giá nằm trên EMA20 là xu hướng ngắn hạn tốt.",
 ema50:"EMA50: xu hướng trung hạn. Giá trên EMA50 thường là xu hướng tăng.",
 rsi:"RSI đo sức mạnh giá từ 0–100. Trên 70: quá mua, dễ điều chỉnh. Dưới 30: quá bán, dễ hồi phục.",
 macd:"MACD = EMA12 − EMA26. Trên 0 là đà tăng, dưới 0 là đà giảm.",
 sig:"Signal: đường trung bình 9 phiên của MACD. MACD cắt lên Signal là tín hiệu tốt, cắt xuống là tín hiệu xấu.",
 hist:"Histogram = MACD − Signal. Cột dương và tăng dần: đà tăng mạnh lên.",
 vol:"Khối lượng so với trung bình 20 phiên. Trên 1,5 lần là dòng tiền bất thường."};
function kill(){charts.forEach(c=>{try{c.remove()}catch(e){}});charts=[]}
function mk(el,h){const c=LightweightCharts.createChart(el,{autoSize:true,height:h,layout:{background:{color:"#161b22"},textColor:"#8b949e"},grid:{vertLines:{color:"#21262d"},horzLines:{color:"#21262d"}},rightPriceScale:{borderColor:"#30363d"},timeScale:{borderColor:"#30363d"}});charts.push(c);return c}
const line=(c,color,t,v,o={})=>{const s=c.addLineSeries({color,lineWidth:1,priceLineVisible:false,lastValueVisible:false,...o});s.setData(t.map((x,i)=>v[i]==null?null:{time:x,value:v[i]}).filter(Boolean));return s};
function detail(){
 const box=$("#detail");kill();const s=ST.find(x=>x.s==sel);
 if(!s){box.innerHTML='<div class="card mu">Chọn một mã ở thanh phía trên để xem biểu đồ và tín hiệu.</div>';return}
 const d=P&&P.stocks.find(x=>x.symbol==sel),C=d&&d.candles||[],lk=`<a class="rf" target="_blank" rel="noopener" href="https://finance.yahoo.com/quote/${s.s}.VN">Tra cứu gốc trên Yahoo Finance →</a>`;
 if(C.length<30){box.innerHTML=`<div class="card"><h3>${s.s} — ${esc(s.n)} (${s.x})</h3><p class="mu">Chưa có dữ liệu giá (cần ít nhất 30 phiên). ${esc(P&&P.meta.failed&&P.meta.failed[sel]||"")}</p>${lk}</div>`;return}
 const T=C.map(x=>x.t),cl=C.map(x=>x.c),vo=C.map(x=>x.v),e20=ema(cl,20),e50=ema(cl,50),B=bb(cl),R=rsi(cl),X=macd(cl),vm=sma(vo,20),n=C.length-1;
 box.innerHTML=`<div class="g2"><div>
 <div class="card"><h3>Nến, EMA20, EMA50, Bollinger(20,2), khối lượng — ${s.s}</h3><div id="c1" class="ch"></div>
  <div class="mu" style="font-size:12px">Vàng: EMA20 · Xanh: EMA50 · Xám nét đứt: Bollinger · Cột dưới: khối lượng và MA20 khối lượng. Mỗi nhóm một chỉ báo (xu hướng, động lượng, biến động, khối lượng) để tránh trùng lặp.</div></div>
 <div class="card"><h3>RSI(14)</h3><div id="c2" class="ch s"></div></div>
 <div class="card"><h3>MACD(12, 26, 9)</h3><div id="c3" class="ch s"></div></div></div>
 <div><div class="card"><h3>Tín hiệu tổng hợp</h3><div id="sg"></div></div>
 <div class="card"><h3>Cảnh báo</h3><div id="al"></div></div>
 <div class="card"><h3>Chỉ báo hiện tại</h3><div id="iv"></div><p>${lk}</p></div></div></div>`;
 const c1=mk($("#c1"),280),cs=c1.addCandlestickSeries({upColor:"#3fb950",downColor:"#f85149",borderVisible:false,wickUpColor:"#3fb950",wickDownColor:"#f85149"});
 cs.setData(C.map(x=>({time:x.t,open:x.o,high:x.h,low:x.l,close:x.c})));
 line(c1,"#d29922",T,e20);line(c1,"#58a6ff",T,e50);
 line(c1,"#6e7681",T,B.map(b=>b&&b.u),{lineStyle:2});line(c1,"#6e7681",T,B.map(b=>b&&b.l),{lineStyle:2});
 const hv=c1.addHistogramSeries({priceScaleId:"vol",priceFormat:{type:"volume"},lastValueVisible:false,priceLineVisible:false});
 hv.setData(C.map(x=>({time:x.t,value:x.v,color:x.c>=x.o?"#23863666":"#da363366"})));
 c1.priceScale("vol").applyOptions({scaleMargins:{top:.8,bottom:0}});line(c1,"#e3b341",T,vm,{priceScaleId:"vol"});
 const c2=mk($("#c2"),130);line(c2,"#a371f7",T,R,{lastValueVisible:true});line(c2,"#f85149",T,T.map(()=>70),{lineStyle:2});line(c2,"#3fb950",T,T.map(()=>30),{lineStyle:2});
 const c3=mk($("#c3"),130);c3.addHistogramSeries({priceLineVisible:false,lastValueVisible:false}).setData(T.map((t,i)=>X.h[i]==null?null:{time:t,value:X.h[i],color:X.h[i]>=0?"#3fb950aa":"#f85149aa"}).filter(Boolean));
 line(c3,"#58a6ff",T,X.ln);line(c3,"#d29922",T,X.sg);
 [c1,c2,c3].forEach(c=>c.timeScale().setVisibleLogicalRange({from:Math.max(0,n-120),to:n+3}));
 // Cảnh báo
 const up=(a,b)=>a[n-1]!=null&&b[n-1]!=null&&a[n]!=null&&b[n]!=null&&a[n-1]<=b[n-1]&&a[n]>b[n],dw=(a,b)=>a[n-1]!=null&&b[n-1]!=null&&a[n]!=null&&b[n]!=null&&a[n-1]>=b[n-1]&&a[n]<b[n];
 const A=[];const r=R[n],vr=vm[n]?vo[n]/vm[n]:null;
 if(r>70)A.push(["RSI > 70: quá mua","br"]);if(r<30)A.push(["RSI < 30: quá bán","bg"]);
 if(up(X.ln,X.sg))A.push(["MACD cắt lên Signal","bg"]);if(dw(X.ln,X.sg))A.push(["MACD cắt xuống Signal","br"]);
 if(up(cl,e50))A.push(["Giá cắt lên EMA50","bg"]);if(dw(cl,e50))A.push(["Giá cắt xuống EMA50","br"]);
 if(up(e20,e50))A.push(["Golden cross: EMA20 cắt lên EMA50","bg"]);if(dw(e20,e50))A.push(["Death cross: EMA20 cắt xuống EMA50","br"]);
 if(B[n]&&cl[n]>B[n].u)A.push(["Giá phá dải Bollinger trên","by"]);if(B[n]&&cl[n]<B[n].l)A.push(["Giá phá dải Bollinger dưới","by"]);
 if(vr>1.5)A.push([`Khối lượng ${fmt(vr,1)} lần trung bình 20 phiên`,"by"]);
 $("#al").innerHTML=A.length?A.map(a=>`<span class="bd ${a[1]}">${a[0]}</span>`).join(""):'<span class="mu">Không có cảnh báo trong phiên gần nhất.</span>';
 // Tín hiệu tổng hợp: mỗi nhóm chỉ báo cho -1/0/+1
 let sc=0;const W=[];
 if(e20[n]!=null&&e50[n]!=null){if(e20[n]>e50[n]&&cl[n]>e50[n]){sc++;W.push("EMA20 trên EMA50 và giá trên EMA50 — xu hướng tăng")}else if(e20[n]<e50[n]&&cl[n]<e50[n]){sc--;W.push("EMA20 dưới EMA50 và giá dưới EMA50 — xu hướng giảm")}else W.push("Xu hướng EMA chưa rõ ràng")}
 if(r!=null){if(r>70){sc--;W.push(`RSI ${fmt(r,1)} — vùng quá mua`)}else if(r<30){sc++;W.push(`RSI ${fmt(r,1)} — vùng quá bán`)}else W.push(`RSI ${fmt(r,1)} — vùng trung tính`)}
 if(X.h[n]!=null){if(X.ln[n]>X.sg[n]){sc++;W.push("MACD trên Signal — đà tăng")}else{sc--;W.push("MACD dưới Signal — đà giảm")}}
 if(B[n]){if(cl[n]>B[n].u)W.push("Giá trên dải Bollinger trên — biến động mạnh, dễ điều chỉnh");else if(cl[n]<B[n].l)W.push("Giá dưới dải Bollinger dưới — biến động mạnh")}
 if(vr>1.5)W.push("Khối lượng cao bất thường — xác nhận biến động giá");
 const v=sc>=2?"MUA":sc<=-2?"BÁN":"TRUNG LẬP";
 $("#sg").innerHTML=`<span class="sig ${v=="BÁN"?"BAN":v=="MUA"?"MUA":""}">${v}</span><ul class="mu" style="padding-left:18px">${W.map(w=>`<li>${w}</li>`).join("")}</ul><div class="mu" style="font-size:11px">Chỉ mang tính tham khảo, không phải khuyến nghị đầu tư.</div>`;
 // Bảng chỉ báo + tooltip (bấm ⓘ để xem, dùng được trên iPhone)
 const rows=[["Giá đóng cửa",fmt(cl[n]),"close"],["EMA20",fmt(e20[n]),"ema20"],["EMA50",fmt(e50[n]),"ema50"],["RSI (14)",fmt(r,1),"rsi"],["MACD",fmt(X.ln[n],3),"macd"],["Signal",fmt(X.sg[n],3),"sig"],["Histogram",fmt(X.h[n],3),"hist"],["Khối lượng / TB 20 phiên",vr==null?"—":fmt(vr,2)+" lần","vol"]];
 $("#iv").innerHTML=rows.map(x=>`<div class="row"><span>${x[0]}<span class="i" data-tip="${x[2]}">i</span></span><b>${x[1]}</b></div><div class="tip" id="tp-${x[2]}">${TIPS[x[2]]}</div>`).join("");
}

// ===== Tab 2 =====
function t2(){
 const mc=M&&M.criteria||{};
 if(M&&M.scored_at&&ls.get("scst","")!==M.scored_at){const n={};CR.forEach(c=>{if(mc[c[0]]&&typeof mc[c[0]].score==="number")n[c[0]]=mc[c[0]].score});ls.set("sc",n);ls.set("scst",M.scored_at)}
 const sc=ls.get("sc",{}),th=ls.get("th",M&&M.thresholds||{sell:-4,buy:4});
 let h='<div class="card"><h3>Bảng chấm điểm tín hiệu vĩ mô – địa chính trị</h3><p class="mu">Chấm −1 (tiêu cực) · 0 (trung lập) · +1 (tích cực) cho cổ phiếu Việt Nam. Điểm bạn chọn được lưu ngay trên trình duyệt này.</p>';
 GH.forEach((gh,gi)=>{h+=`<div class="rf" style="margin-top:12px">${gh}</div>`;
  CR.filter(c=>c[3]==gi).forEach(c=>{const m=mc[c[0]]||{};
   const bx=(lb,o)=>`<span class="bx"><i>${lb}</i>${o&&o.value!=null?fmt(o.value,Number.isInteger(o.value)||Math.abs(o.value)>=1000?0:2)+" "+esc(o.unit||""):""}${o&&o.date?`<i>${esc(o.date)} · ${esc(o.source||"")}</i>`:""}</span>`;
   h+=`<div class="cr"><div><b>${c[0]}. ${c[1]}</b><em>${c[2]}</em>${m.reason?`<div style="font-size:12px;margin:4px 0">${esc(m.reason)} ${/^https?:\/\//.test(m.url||"")?`<a class="rf" target="_blank" rel="noopener" href="${esc(m.url)}">Nguồn →</a>`:""}</div>`:""}${c[4]?bx("KỲ TRƯỚC",m.previous)+bx("HIỆN TẠI",m.current):""}</div>
   <select data-c="${c[0]}">${[-1,0,1].map(v=>`<option value="${v}" ${(sc[c[0]]||0)==v?"selected":""}>${v>0?"+"+v:v}</option>`).join("")}</select></div>`})});
 h+=`</div><div class="card"><h3>Tổng điểm</h3><div id="tot"></div><p>Ngưỡng BÁN ≤ <input id="ths" type="number" value="${th.sell}"> · Ngưỡng MUA ≥ <input id="thb" type="number" value="${th.buy}"></p><div id="hs"></div></div>
 <div class="card"><h3>Tác động theo ngành</h3><div id="imp"></div></div>`;
 $("#t2").innerHTML=h;sum()}
function sum(){
 const sc=ls.get("sc",{}),s=+$("#ths").value,b=+$("#thb").value;ls.set("th",{sell:s,buy:b});
 const tot=CR.reduce((a,c)=>a+(sc[c[0]]||0),0),v=tot<=s?"BÁN":tot>=b?"MUA":"TRUNG LẬP";
 const H={},day=new Date().toISOString().slice(0,10);((M&&M.history)||[]).forEach(x=>{if(x&&x.date)H[x.date]=x.total});Object.assign(H,ls.get("hist",{}));H[day]=tot;ls.set("hist",H);
 const days=Object.keys(H).sort(),prev=days.length>1?H[days[days.length-2]]:null;
 const xu=prev==null?"chưa đủ dữ liệu so sánh":tot>prev?"đang cải thiện ▲":tot<prev?"đang xấu đi ▼":"đi ngang ►";
 $("#tot").innerHTML=`<span class="sig ${v=="BÁN"?"BAN":v=="MUA"?"MUA":""}">${v}</span> <b>${tot>0?"+"+tot:tot}</b> điểm — xu hướng: ${xu}`;
 const pts=days.map((d,i)=>[days.length<2?150:i*300/(days.length-1),50-H[d]*(40/14)]);
 $("#hs").innerHTML=days.length<2?'<span class="mu">Lịch sử: cần ít nhất 2 ngày để vẽ đường xu hướng.</span>':`<svg viewBox="-5 0 310 100" style="width:100%;max-width:520px"><line x1="0" x2="300" y1="50" y2="50" stroke="#30363d"/><polyline fill="none" stroke="#d29922" stroke-width="2" points="${pts.map(p=>p.join(",")).join(" ")}"/></svg><div class="mu" style="font-size:11px">${days[0]} → ${days[days.length-1]}</div>`;
 const rw=CR.filter(c=>(sc[c[0]]||0)!=0).map(c=>{const p=sc[c[0]]>0;return `<tr><td>${c[0]}. ${c[1]} (${p?"+1":"−1"})</td><td class="${p?"up":"dn"}">${p?"Thuận lợi: "+c[5]:"Bất lợi: "+c[6]}</td></tr>`});
 $("#imp").innerHTML=rw.length?`<table>${rw.join("")}</table><p class="mu" style="font-size:11px">Nhận định chung theo logic kinh tế, không phải kết luận cho từng mã.</p>`:'<span class="mu">Chọn điểm khác 0 để xem tác động.</span>'}

// ===== Tab 3 =====
function t3(){
 const it=a=>(a||[]).map(x=>`<div class="nw"><span class="mu" style="font-size:12px">${esc(x.date||"")}</span> <span class="tag">${esc(x.label||"")}</span><div><b>${esc(x.title)}</b></div><div class="mu">${esc(x.summary||"")}</div>${/^https?:\/\//.test(x.url||"")?`<a target="_blank" rel="noopener" href="${esc(x.url)}">Đọc bài gốc →</a>`:""}</div>`).join("")||'<div class="mu">Chưa có dữ liệu.</div>';
 const sec=(t,a)=>`<div class="card"><h3>${t}</h3>${it(a)}</div>`;
 const ind=N&&N.industry||{};
 $("#t3").innerHTML=sec("Chính sách nhà nước thúc đẩy tăng trưởng",N&&N.policy)+sec("Pháp luật kinh tế",N&&N.law)+G.map(g=>sec("Tin tức liên quan — "+g,ind[g])).join("")}

// ===== Sự kiện =====
document.addEventListener("click",e=>{const t=e.target;
 if(t.closest("#tabs button")){const k=t.dataset.t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b==t));[1,2,3].forEach(i=>$("#t"+i).classList.toggle("hide",i!=k));$("#bar").classList.toggle("hide",k!="1")}
 else if(t.dataset.g!=null&&t.closest("#grp")){grp=+t.dataset.g;cards()}
 else if(t.closest(".sc")){sel=t.closest(".sc").dataset.s;cards();detail()}
 else if(t.dataset.tip){$("#tp-"+t.dataset.tip).classList.toggle("on")}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.c){const sc=ls.get("sc",{});sc[t.dataset.c]=+t.value;ls.set("sc",sc);sum()}else if(t.id=="ths"||t.id=="thb")sum()});
window.addEventListener("error",()=>{});
cards();detail();t2();t3();load();
setInterval(load,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script></body></html>
