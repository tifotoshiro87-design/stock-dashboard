function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}
function ema(a,n){const o=Array(a.length).fill(null);if(a.length<n)return o;let p=a.slice(0,n).reduce((x,y)=>x+y,0)/n;o[n-1]=p;const k=2/(n+1);for(let i=n;i<a.length;i++){p=a[i]*k+p*(1-k);o[i]=p}return o}
function rsi(a,n=14){const o=Array(a.length).fill(null);if(a.length<=n)return o;let g=0,l=0;for(let i=1;i<=n;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}g/=n;l/=n;o[n]=l==0?100:100-100/(1+g/l);
 for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=l==0?100:100-100/(1+g/l)}return o}
function bb(a,n=20,k=2){const m=sma(a,n);return a.map((_,i)=>{if(m[i]==null)return null;const s=a.slice(i-n+1,i+1),sd=Math.sqrt(s.reduce((x,y)=>x+(y-m[i])**2,0)/n);return{u:m[i]+k*sd,l:m[i]-k*sd}})}

 if(i0>=0)ema(ln.slice(i0),9).forEach((v,i)=>sg[i0+i]=v);return{ln,sg,h:ln.map((v,i)=>sg[i]==null?null:v-sg[i])}}

function pivots(C,k=4){
 const P=[];
 for(let i=k;i<C.length-k;i++){let hi=true,lo=true;
  for(let j=i-k;j<=i+k;j++){if(C[j].h>C[i].h)hi=false;if(C[j].l<C[i].l)lo=false}
  if(hi)P.push({i,t:C[i].t,p:C[i].h,y:"H"});else if(lo)P.push({i,t:C[i].t,p:C[i].l,y:"L"})}
 const Z=[]; // gộp đỉnh/đáy liên tiếp cùng loại, giữ điểm cực trị
 P.forEach(q=>{const l=Z[Z.length-1];if(l&&l.y==q.y){if((q.y=="H"&&q.p>l.p)||(q.y=="L"&&q.p<l.p))Z[Z.length-1]=q}else Z.push(q)});
 const l=Z[Z.length-1]; // điểm tạm cho sóng đang chạy (chưa đủ k phiên xác nhận)
 if(l){const g=C.slice(l.i+1);if(g.length>2){let m=0;g.forEach((c,j)=>{if(l.y=="H"?c.l<g[m].l:c.h>g[m].h)m=j});Z.push({i:l.i+1+m,t:g[m].t,p:l.y=="H"?g[m].l:g[m].h,y:l.y=="H"?"L":"H"})}}
 return Z}
function detectPatterns(C){
 if(!C||C.length<60)return [];
 const Z=pivots(C),n=C.length,out=[],near=q=>q.i>=n-15,d=(a,b)=>Math.abs(a-b);
 const ok=(v,a,b)=>v>=a-.05&&v<=b+.05;
 const mkp=(k,name,dir,lines,pts,lb)=>{
  const P=pts.map(q=>q.p),hi=Math.max(...P),lo=Math.min(...P),amp=hi-lo,zone=pts[pts.length-1].p;
  const target=dir=="bull"?zone+amp:dir=="bear"?zone-amp:null;
  return {k,name,dir,lines,zone,target,marks:pts.map((q,j)=>({t:q.t,up:q.y=="H",l:lb?lb[j]:"",p:q.p}))}};
 if(Z.length>=5){const s5=Z.slice(-5),[x,a,b,c,e]=s5;
  if(near(e)){const XA=d(a.p,x.p),AB=d(b.p,a.p),BC=d(c.p,b.p);
   if(XA>0&&AB>0){const ab=AB/XA,bc=BC/AB,ad=d(e.p,a.p)/XA,dir=e.y=="L"?"bull":"bear",L="XABCD".split("");
    [["gartley","Gartley",.618,.618,.786,.786],["bat","Bat",.382,.5,.886,.886],["butterfly","Butterfly",.786,.786,1.272,1.618],["crab","Crab",.382,.618,1.618,1.618]]
     .forEach(r=>{if(ok(ab,r[2],r[3])&&ok(bc,.382,.886)&&ok(ad,r[4],r[5]))out.push(mkp(r[0],r[1],dir,[s5],s5,L))});
    const xc=d(c.p,x.p)/XA,cd=d(c.p,e.p)/d(c.p,x.p),beyond=dir=="bull"?c.p>a.p:c.p<a.p;
    if(beyond&&ok(ab,.382,.618)&&ok(xc,1.13,1.414)&&ok(cd,.786,.786))out.push(mkp("cypher","Cypher",dir,[s5],s5,L))}}}
 if(!out.length&&Z.length>=4){const s4=Z.slice(-4),[a,b,c,e]=s4;
  if(near(e)){const AB=d(b.p,a.p),BC=d(c.p,b.p),CD=d(e.p,c.p);
   if(AB>0&&ok(BC/AB,.382,.886)&&CD/AB>.85&&CD/AB<1.15)out.push(mkp("abcd","ABCD",e.y=="L"?"bull":"bear",[s4],s4,["A","B","C","D"]))}}
 if(Z.length>=3){const s3=Z.slice(-3),[a,b,c]=s3;
  if(near(c)&&d(a.p,c.p)/a.p<.03&&d(a.p,b.p)/a.p>.05){
   if(a.y=="H")out.push(mkp("dtop","Hai đỉnh (Double Top)","bear",[s3],s3));else out.push(mkp("dbot","Hai đáy (Double Bottom)","bull",[s3],s3))}}
 if(Z.length>=5){const s5=Z.slice(-5),[ls,,h,,rs]=s5;
  if(near(rs)&&d(ls.p,rs.p)/h.p<.08){
   if(ls.y=="H"&&h.p>ls.p&&h.p>rs.p&&(h.p-Math.max(ls.p,rs.p))/h.p>.02)out.push(mkp("hs","Vai đầu vai","bear",[s5],s5,["Vai","","Đầu","","Vai"]));
   if(ls.y=="L"&&h.p<ls.p&&h.p<rs.p&&(Math.min(ls.p,rs.p)-h.p)/h.p>.02)out.push(mkp("ihs","Vai đầu vai ngược","bull",[s5],s5,["Vai","","Đầu","","Vai"]))}}
 const R=Z.slice(-8),H=R.filter(q=>q.y=="H").slice(-3),Lw=R.filter(q=>q.y=="L").slice(-3);
 if(H.length==3&&Lw.length==3&&near(Z[Z.length-1])&&Math.min(H[0].i,Lw[0].i)>n-120){
  const hs=(H[2].p-H[0].p)/H[0].p,ls=(Lw[2].p-Lw[0].p)/Lw[0].p,w0=H[0].p-Lw[0].p,w1=H[2].p-Lw[2].p;
  const fl=x=>Math.abs(x)<.025,up=x=>x>=.025,dn=x=>x<=-.025,cv=w1>0&&w0>0&&w1<.85*w0,all=H.concat(Lw);
  let r=null;
  if(cv){if(fl(hs)&&up(ls))r=["asc","Tam giác tăng","bull"];else if(dn(hs)&&fl(ls))r=["desc","Tam giác giảm","bear"];else if(dn(hs)&&up(ls))r=["sym","Tam giác cân","neu"];else if(up(hs)&&up(ls))r=["rwedge","Nêm tăng (Rising Wedge)","bear"];else if(dn(hs)&&dn(ls))r=["fwedge","Nêm giảm (Falling Wedge)","bull"]}
  else if(fl(hs)&&fl(ls)&&w0/H[0].p>.04)r=["rect","Hình chữ nhật","neu"];
  if(r)out.push(mkp(r[0],r[1],r[2],[H,Lw],all.sort((p,q)=>p.i-q.i)))}
 return out.slice(0,5)}

// Mục có sẵn theo thứ tự cố định + mục do bạn tự thêm trong cau_hinh_tin.txt (hiện ở cuối)
function dsMuc(tab,ORDER){const co=new Set(ORDER.map(o=>o[0]));return ORDER.concat(secs(tab).filter(s=>!co.has(s.key)).map(s=>[s.key,s.name||s.key]))}
// Menu đầu mục: bấm vào một mục để xem tin của mục đó. Mặc định là mục đầu tiên có tin (không để trống).
const BAM={},SEL={};   // BAM: mục người dùng đã bấm; SEL: mục đang hiện
function chon(nhom,ds){const b=ds.find(d=>d[0]==BAM[nhom]);SEL[nhom]=b?b[0]:(ds.find(d=>d[2]>0)||ds[0])[0];return SEL[nhom]}
function menu(nhom,ds,cls=""){return `<div class="mn ${cls}" role="tablist">`+ds.map(([k,t,n])=>`<button role="tab" data-mn="${nhom}" data-k="${esc(k)}" class="${SEL[nhom]==k?"on":""}">${esc(t)}${n!=null?`<i>${n}</i>`:""}</button>`).join("")+`</div>`}
function loiCH(d){const l=d&&d.meta&&d.meta.cau_hinh_loi;return l&&l.length?`<div style="font-size:12px;color:#f0883e;margin:0 0 8px">⚠ File cau_hinh_tin.txt có ${l.length} dòng chưa đúng (bot đã bỏ qua các dòng đó): ${l.slice(0,3).map(esc).join(" · ")}</div>`:""}

// ===== Tab chính 1: Tin nhanh Nha Trang =====
const NT_ORDER=[["ha_tang","Hạ tầng giao thông"],["quy_hoach","Quy hoạch đô thị – Bất động sản & dự án"],["kinh_te_vh","Môi trường kinh tế – văn hóa"],["du_lich","Thị trường du lịch – dịch vụ"],["giao_duc","Giáo dục"],["phap_luat","Pháp luật"],["thoi_tiet","Dự báo thời tiết"]];
function renderNT(){
 const S=secs("nha_trang"),f=k=>S.find(s=>s.key==k)||{};
 const ds=dsMuc("nha_trang",NT_ORDER).map(([k,t])=>[k,k=="thoi_tiet"?t:(f(k).name||t),(f(k).items||[]).length]);
 const k=chon("nt",ds),t=ds.find(d=>d[0]==k)[1];
 $("#m1").innerHTML=ghiChu(T)+menu("nt",ds.map(d=>[d[0],d[1],d[0]=="thoi_tiet"?null:d[2]]))+
  (k=="thoi_tiet"?khoi("nt-"+k,t,f(k).items,`<div id="wxbox">${wxHtml()}</div><div class="wsec">Tin cảnh báo mưa bão, thời tiết</div>`):khoi("nt-"+k,t,f(k).items))}
// Thời tiết: lấy trực tiếp Open-Meteo (miễn phí, không cần key); lỗi thì dùng bản lưu trong tin.json
const WXC={0:["☀️","Trời quang"],1:["🌤️","Ít mây"],2:["⛅","Có mây"],3:["☁️","Nhiều mây"],45:["🌫️","Sương mù"],48:["🌫️","Sương mù"],51:["🌦️","Mưa phùn nhẹ"],53:["🌦️","Mưa phùn"],55:["🌦️","Mưa phùn dày"],56:["🌧️","Mưa phùn lạnh"],57:["🌧️","Mưa phùn lạnh"],61:["🌧️","Mưa nhẹ"],63:["🌧️","Mưa vừa"],65:["🌧️","Mưa to"],66:["🌧️","Mưa lạnh"],67:["🌧️","Mưa lạnh to"],80:["🌦️","Mưa rào nhẹ"],81:["🌧️","Mưa rào"],82:["⛈️","Mưa rào rất to"],95:["⛈️","Dông"],96:["⛈️","Dông, mưa đá"],99:["⛈️","Dông, mưa đá"]};
const wc=c=>WXC[c]||["🌡️","—"];
const WXURL="https://api.open-meteo.com/v1/forecast?latitude=12.2388&longitude=109.1967&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=Asia%2FHo_Chi_Minh&forecast_days=8";
async function loadWX(){try{const r=await fetch(WXURL,{cache:"no-store"});if(!r.ok)throw 0;WX=await r.json();WX._live=true}catch(e){}const b=$("#wxbox");if(b)b.innerHTML=wxHtml()}
// Ảnh vệ tinh Himawari (Nhật Bản) qua NASA GIBS — miễn phí, không cần key. Vùng Khánh Hòa: kinh độ 106,7–111,7; vĩ độ 10,2–14,2
// (Nha Trang 109,1967 / 12,2388 nằm giữa ảnh). Ảnh chưa có thì tự lùi giờ, bỏ lớp đường bờ biển nếu lỗi.
const VT={kind:"ir",lan:0};
const VT_LOP={ir:["Himawari_AHI_Band13_Clean_Infrared","Hồng ngoại — thấy mây cả ngày lẫn đêm (cập nhật 10 phút/lần)"],vis:["Himawari_AHI_Band3_Red_Visible_1km","Ảnh nhìn thấy — ảnh chụp ban ngày, rõ chi tiết mây"]};
const p2=n=>String(n).padStart(2,"0");
function vtGio(lan){
 let t=Date.now()-(50+Math.floor(lan/2)*30)*60000;
 if(VT.kind=="vis"){const h=(new Date(t).getUTCHours()+7)%24;if(h<7||h>=17){const d=new Date(t+7*3600000);if(h<7)d.setUTCDate(d.getUTCDate()-1);d.setUTCHours(16,0,0,0);t=d.getTime()-7*3600000-Math.floor(lan/2)*1800000}}
 const d=new Date(Math.floor(t/600000)*600000);return d}
function vtUrl(lan){
 const d=vtGio(lan),iso=`${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}T${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:00Z`;
 const lop=VT_LOP[VT.kind][0]+(lan%2==0?",Coastlines_15m":"");
 return "https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetMap&VERSION=1.1.1&SRS=EPSG:4326&STYLES=&TRANSPARENT=FALSE"+
  "&LAYERS="+encodeURIComponent(lop)+"&BBOX=106.7,10.2,111.7,14.2&WIDTH=640&HEIGHT=512&FORMAT=image/png&TIME="+encodeURIComponent(iso)}
function vtNhan(lan){const d=new Date(vtGio(lan).getTime()+7*3600000);return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())} ngày ${p2(d.getUTCDate())}/${p2(d.getUTCMonth()+1)} (giờ VN)`}
function vtOk(img){const c=$("#vtcap");if(c)c.textContent="Ảnh chụp lúc "+vtNhan(VT.lan)+" · vệ tinh Himawari, nguồn NASA GIBS";const m=$("#vtmsg");if(m)m.remove()}
function vtLoi(img){if(VT.lan<7){VT.lan++;img.src=vtUrl(VT.lan)}else{img.remove();const m=$("#vtmsg");if(m)m.textContent="Chưa tải được ảnh vệ tinh lúc này. Bấm các liên kết bên dưới để xem trực tiếp."}}
function veTinh(){
 VT.lan=0;
 return `<div class="wsec">Ảnh vệ tinh Nha Trang – Khánh Hòa</div>
 <div style="margin-bottom:6px">${Object.keys(VT_LOP).map(k=>`<button class="tvb ${VT.kind==k?"on":""}" data-vt="${k}">${k=="ir"?"Hồng ngoại":"Ảnh ban ngày"}</button>`).join("")}</div>
 <div class="vt"><div class="vtm" id="vtmsg">Đang tải ảnh vệ tinh…</div><img alt="Ảnh vệ tinh khu vực Nha Trang – Khánh Hòa" src="${vtUrl(0)}" onload="vtOk(this)" onerror="vtLoi(this)"><span class="pin"></span><span class="pinl">Nha Trang</span></div>
 <div class="mu" style="font-size:11px;margin:4px 0 2px" id="vtcap">${esc(VT_LOP[VT.kind][1])}</div>
 <div style="font-size:12px;margin-bottom:4px">Xem ảnh mây động: <a class="rf" target="_blank" rel="noopener" href="https://zoom.earth/maps/satellite/#view=12.24,109.2,7z">Zoom Earth →</a> · <a class="rf" target="_blank" rel="noopener" href="https://www.windy.com/-Satellite-satellite?satellite,12.240,109.197,7">Windy →</a></div>`}
function wxHtml(){
 const w=(WX&&WX.daily)?WX:(T&&T.weather&&T.weather.daily?T.weather:null);
 if(!w)return veTinh()+'<div class="wsec">Dự báo 7 ngày tới</div><div class="mu" style="font-size:12px">Đang tải dự báo thời tiết Nha Trang…</div>';
 const c=w.current||{},D=w.daily,TH=["CN","T2","T3","T4","T5","T6","T7"];
 const now=c.weather_code!=null?`<div class="wnow"><span style="font-size:40px">${wc(c.weather_code)[0]}</span><span class="t">${fmt(c.temperature_2m,0)}°C</span><span class="mu">${wc(c.weather_code)[1]} · cảm giác ${fmt(c.apparent_temperature,0)}°C<br>Độ ẩm ${fmt(c.relative_humidity_2m,0)}% · gió ${fmt(c.wind_speed_10m,0)} km/h</span></div>`:"";
 const days=(D.time||[]).map((t,i)=>{const dt=new Date(t+"T00:00:00"),x=wc(D.weather_code[i]);
  return `<div class="wd"><b>${i==0?"Hôm nay":TH[dt.getDay()]+" "+t.slice(8,10)+"/"+t.slice(5,7)}</b><div class="ic">${x[0]}</div><div>${esc(x[1])}</div><div><span class="dn">${fmt(D.temperature_2m_max[i],0)}°</span> / <span style="color:#79c0ff">${fmt(D.temperature_2m_min[i],0)}°</span></div><div class="mu">💧 ${fmt(D.precipitation_probability_max&&D.precipitation_probability_max[i],0)}% · ${fmt(D.precipitation_sum[i],1)}mm</div></div>`}).join("");
 return `${now}${veTinh()}<div class="wsec">Dự báo hôm nay và 7 ngày tới</div><div class="wx">${days}</div><div class="mu" style="font-size:11px;margin-bottom:6px">Dự báo cho Nha Trang — nguồn Open-Meteo${w._live?" (trực tiếp)":" (bản lưu "+esc(T&&T.meta&&T.meta.fetched_at||"")+")"}${(D.time||[]).length<8?" · bản lưu cũ chỉ có "+(D.time||[]).length+" ngày, sẽ đủ sau lần cập nhật tới":""}.</div>`}

// ===== Tab chính 3: Công nghệ =====
// Xe ô tô chia theo hãng (thứ tự cố định). "o_to" = các hãng còn lại, trừ xe Trung Quốc.
const CN_XE=[["xe_honda","Honda",/honda|cr-v|hr-v|br-v|wr-v|civic|accord/i],["xe_suzuki","Suzuki",/suzuki|xl7|ertiga|jimny|swift|fronx|ciaz|vitara/i],
 ["xe_toyota","Toyota",/toyota|vios|camry|corolla|innova|fortuner|hilux|yaris|raize|veloz|avanza|land cruiser|prado|wigo/i],
 ["xe_hyundai","Hyundai",/hyundai|santa fe|tucson|creta|accent|palisade|stargazer|grand i10|elantra|custin|ioniq|kona/i],
 ["xe_vinfast","VinFast",/vinfast|\bvf ?\d|limo green|minio green|herio green|nerio green/i],["o_to","Khác",null]];
function xeTheoHang(S){
 const f=k=>(S.find(s=>s.key==k)||{}).items;
 if(S.some(s=>/^xe_/.test(s.key)))return CN_XE.map(([k,t])=>[k,t,f(k)||[]]);
 // Dữ liệu cũ (bot chưa chạy bản mới): tự chia tin "o_to" theo tên hãng trong tiêu đề
 const con=(f("o_to")||[]).slice(),out=CN_XE.map(([k,t])=>[k,t,[]]);
 con.forEach(x=>{const i=CN_XE.findIndex(h=>h[2]&&h[2].test(x.title));out[i<0?5:i][2].push(x)});return out}
function renderCN(){
 const S=secs("cong_nghe"),f=k=>S.find(s=>s.key==k)||{},biet=new Set(CN_XE.map(h=>h[0]).concat(["ai"]));
 const xe=xeTheoHang(S),nXe=xe.reduce((a,h)=>a+h[2].length,0);
 const chinh=[["xe","Xe ô tô",nXe],["ai","Công nghệ AI",(f("ai").items||[]).length]].concat(S.filter(s=>!biet.has(s.key)).map(s=>[s.key,s.name||s.key,(s.items||[]).length]));
 const k=chon("cn",chinh);let h=ghiChu(T)+menu("cn",chinh);
 if(k=="xe"){const ds=xe.map(([kk,t,it])=>[kk,t,it.length]),kx=chon("cnxe",ds),x=xe.find(a=>a[0]==kx);
  h+=menu("cnxe",ds,"sub")+khoi("cn-"+kx,"Xe "+(kx=="o_to"?"hãng khác":x[1]),x[2],'<div class="mu" style="font-size:12px;margin-bottom:4px">Tin ô tô theo hãng. Đã loại trừ xe Trung Quốc, xe máy, tin tai nạn/vi phạm giao thông.</div>')}
 else h+=khoi("cn-"+k,(chinh.find(c=>c[0]==k)||[])[1],f(k).items);
 $("#m3").innerHTML=h}

 $("#t3").innerHTML=ghiChu(T)+menu("ck",ds)+khoi("ck-"+k,ds.find(d=>d[0]==k)[1],f(k).items)}

// ===== Sự kiện =====
function chonM(m){ls.set("mtab",m);document.documentElement.classList.remove("kem");const tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.content="#0a1220";document.querySelectorAll("#mtabs button").forEach(b=>b.classList.toggle("on",b.dataset.m==m));[1,2,3,4,5].forEach(i=>$("#m"+i).classList.toggle("hide",i!=m));$("#ckhead").classList.toggle("hide",m!=2);window.scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target;
 if(t.closest("#mtabs button")){chonM(+t.closest("#mtabs button").dataset.m);return}
 const mn=t.closest("[data-mn]");if(mn){BAM[mn.dataset.mn]=mn.dataset.k;({nt:renderNT,ck:t3,cn:renderCN,cnxe:renderCN,qt:renderQT})[mn.dataset.mn]();return}
 const vb=t.closest("[data-vt]");if(vb){VT.kind=vb.dataset.vt;const b=$("#wxbox");if(b)b.innerHTML=wxHtml();return}
 if(t.dataset.more){const id=t.dataset.more,x=$("#x-"+id),mo=!OPEN.has(id);mo?OPEN.add(id):OPEN.delete(id);x.classList.toggle("hide",!mo);const n=x.querySelectorAll(".ni").length;t.textContent=mo?"Thu gọn ▲":`Xem thêm ${n} tin ▼`;return}
 if(t.closest("#tabs button")){const k=t.dataset.t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b==t));[1,2,3,4].forEach(i=>$("#t"+i).classList.toggle("hide",i!=k));$("#bar").classList.toggle("hide",k!="1")}
 else if(t.dataset.g!=null&&t.closest("#grp")){grp=+t.dataset.g;cards()}
 else if(t.closest(".sc")){sel=t.closest(".sc").dataset.s;cards();detail()}
 else if(t.closest("tr[data-s4]")){const tr=t.closest("tr[data-s4]");sel=tr.dataset.s4;grp=+tr.dataset.g4;cards();detail();
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t=="1"));[1,2,3,4].forEach(i=>$("#t"+i).classList.toggle("hide",i!=1));$("#bar").classList.remove("hide")}
 else if(t.closest(".tvb")){tvOn=t.closest(".tvb").dataset.v=="tv";showTV(tatCaMa().find(x=>x.s==sel))}else if(t.closest(".pi")){showPat(+t.closest(".pi").dataset.p)}else if(t.dataset.tip){$("#tp-"+t.dataset.tip).classList.toggle("on")}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.c){const sc=ls.get("sc",{});sc[t.dataset.c]=+t.value;ls.set("sc",sc);sum()}else if(t.id=="ths"||t.id=="thb")sum()});
window.addEventListener("error",()=>{});
chonM([1,2,3,4,5].includes(ls.get("mtab",1))?ls.get("mtab",1):1);
cards();detail();t2();t3();t4();renderVn30();renderNT();renderCN();renderQT();load();loadWX();setInterval(loadWX,1800000);
setInterval(load,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
